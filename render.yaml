# Render blueprint for the Silvergill site and operations portal.
#
# The app is a static single-page bundle: the marketing site, the public
# consignment tracker and the whole portal are all client-side routes. There is
# no server process, so this deploys as a static site.
#
# The rewrite below is load-bearing. Without it, a visitor opening a deep link
# such as /track/SGT-4A7F2C or /portal/records/shipments/SHP-24118 would get a
# 404 from the CDN, because no such file exists on disk — every route has to be
# served index.html and resolved by the router in the browser.

services:
  - type: web
    runtime: static
    name: silvergill
    rootDir: website
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Hashed asset filenames are immutable, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The shell must never be cached, or a deploy would not reach anyone.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ---------------------------------------------------------------------------
  # API. Runs against Neon Postgres; the connection string and JWT secret are
  # set in the Render dashboard, never in this file.
  # ---------------------------------------------------------------------------
  - type: web
    runtime: node
    name: silvergill-api
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # set in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://silvergill.onrender.com
